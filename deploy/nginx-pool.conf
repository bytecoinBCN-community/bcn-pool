# Pool page and its JSON statistics, written by bcn-pool into /var/lib/bcn-pool/api.
server {
    listen 80;
    listen [::]:80;
    server_name pool.bytecoin.community;
    server_tokens off;
    root /var/www/bcn-pool;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        alias /var/lib/bcn-pool/api/;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        location ~ /api/miners/[^/]*$ { }
        location ~ \.tmp$ { return 404; }
    }
    location / { try_files $uri $uri/ =404; }
}
